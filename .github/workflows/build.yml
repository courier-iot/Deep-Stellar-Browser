name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish GitHub Releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "DSB_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "DSB_VERSION_NAME=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "DSB_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # Optional: add these 4 repo secrets later to get a signed release APK.
      #   KEYSTORE_BASE64  (base64 of your .jks)   KEYSTORE_PASSWORD
      #   KEY_ALIAS                                 KEY_PASSWORD
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DSB_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "DSB_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "DSB_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "DSB_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          V="$DSB_VERSION_NAME"
          cp app/build/outputs/apk/debug/app-debug.apk "out/DeepStellar-$V-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "out/DeepStellar-$V-release.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "out/DeepStellar-$V-release-unsigned.apk"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: DeepStellar-${{ env.DSB_VERSION_NAME }}
          path: out/*.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Deep Stellar ${{ env.DSB_VERSION_NAME }}
          files: out/*.apk
          generate_release_notes: true
