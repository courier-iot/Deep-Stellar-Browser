name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish GitHub Releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "DSB_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "DSB_VERSION_NAME=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "DSB_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # Release signing. Add these 4 repository secrets:
      #   KEYSTORE_BASE64  (base64 of your .jks)   KEYSTORE_PASSWORD
      #   KEY_ALIAS                                 KEY_PASSWORD
      - name: Require signing key for releases
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::Release tags need the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets."
          exit 1

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # tr strips any line breaks or spaces that crept in while copying
          printf '%s' "$KS_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DSB_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          DSB_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DSB_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DSB_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Check release signature
        if: env.HAS_KEYSTORE == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Collect APKs
        run: |
          mkdir -p out
          V="$DSB_VERSION_NAME"
          cp app/build/outputs/apk/debug/app-debug.apk "out/DeepStellar-$V-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "out/DeepStellar-$V-release.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "out/DeepStellar-$V-release-unsigned.apk"
          fi
          ls -la out
          # Only the signed release APK goes to GitHub Releases (what your store reads).
          mkdir -p release
          if [ -f "out/DeepStellar-$V-release.apk" ]; then cp "out/DeepStellar-$V-release.apk" release/; fi

      - uses: actions/upload-artifact@v4
        with:
          name: DeepStellar-${{ env.DSB_VERSION_NAME }}
          path: out/*.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Deep Stellar ${{ env.DSB_VERSION_NAME }}
          files: release/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
